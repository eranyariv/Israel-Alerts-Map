name: Deploy Frontend

on:
  workflow_dispatch:   # manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow committing the version bump back to main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Note: no separate build step — deploy/ftp_deploy.py bumps the version and
      # rebuilds frontend/ before uploading, so a build here would just be discarded.
      - name: FTP deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          VITE_RA_RELAY_URL: https://redalert-relay.yellowforest-0da0af56.uaenorth.azurecontainerapps.io
        run: python deploy/ftp_deploy.py

      # ftp_deploy.py bumped frontend/package.json in the working tree; persist it so
      # the version advances on every deployment (workflow_dispatch only — no CI loop).
      - name: Commit version bump
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json
          git commit -m "Deploy: bump version to $VERSION"
          git push
